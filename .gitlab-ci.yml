stages:
  - build
  - test
  - deploy

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx1024m"

# Cache Gradle, Composer, and Node dependencies to speed up jobs
cache:
  key: "shared-deps"
  paths:
    - .gradle/wrapper/
    - .gradle/caches/
    - node_modules/
    - vendor/

build:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -y
    - apt-get install -y curl git unzip zip nodejs npm openjdk-17-jdk \
        php-cli php-mbstring php-gd php-curl php-mysql php-xml composer
    - chmod +x gradlew
    - ./gradlew --version
  script:
    # Clean & build project
    - ./gradlew clean build
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 week

test:
  stage: test
  image: ubuntu:22.04
  before_script:
    - apt-get update -y
    - apt-get install -y php-cli php-mbstring php-gd php-curl php-mysql \
        php-xml unzip git composer nodejs npm
    - composer install --prefer-dist --no-interaction --no-progress
    - npm ci
  script:
    - ./gradlew phpUnitTest
  artifacts:
    when: always
    paths:
      - build/test-logs
    expire_in: 1 week
  dependencies:
    - build

deploy:
  stage: deploy
  image: docker:26.1.3
  services:
    - docker:26.1.3-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash curl docker-cli-compose
    - docker info
    # Pre-pull images so compose starts faster
    - docker pull mysql:8.4
    - docker pull phpmyadmin:5-apache
    - docker pull alextselegidis/easyappointments:latest
  script:
    - docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
    - docker compose ps
  environment:
    name: staging
    url: http://localhost:8080
  dependencies:
    - test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
