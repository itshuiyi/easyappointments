task phpUnitTest(type: Exec) {
    description = 'Run PHPUnit tests'
    group = 'verification'

    // Use direct path for Linux compatibility
    def phpunit = file('vendor/bin/phpunit').exists() ? 'vendor/bin/phpunit' : 'vendor/phpunit/phpunit/phpunit'

    doFirst {
        // Ensure log folder exists
        file('build/test-logs').mkdirs()
    }

    // Run PHPUnit with config
    commandLine 'php', phpunit,
                '--configuration', 'phpunit.xml',  // Your PHPUnit config
                '--testdox',
                '--colors=always',
                '--log-junit', 'build/test-logs/test-results.xml',
                'tests'
}
